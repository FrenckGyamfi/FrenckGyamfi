# Publishes the website to Hostinger (dataitech.eu) whenever changes land on main.
# Only the built site in website/dist is uploaded: never brand-kit/, archive/ or tools/.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (an FTP account in hPanel whose folder is public_html). Optional repository
# variable FTP_DIR if the account's folder is not public_html itself (e.g. "public_html/").
name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:          # "Run workflow" button in the Actions tab, to republish by hand

permissions:
  contents: read

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for s in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check the build holds only the public site
        working-directory: website/dist
        run: |
          for f in index.html privacy.html .htaccess robots.txt sitemap.xml; do
            test -f "$f" || { echo "::error::$f is missing from the build"; exit 1; }
          done
          leaks=$(find . \( -path '*brand-kit*' -o -path '*archive*' -o -path '*tools*' -o -iname '*.xlsx' -o -iname '*.pdf' -o -iname '*invoice*' -o -iname '*.py' \) -print)
          if [ -n "$leaks" ]; then echo "::error::Private files in the build: $leaks"; exit 1; fi
          echo "Uploading $(find . -type f | wc -l) files ($(du -sh . | cut -f1))"

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: website/dist/
          server-dir: ${{ vars.FTP_DIR || './' }}

      - name: Check dataitech.eu serves this build
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://dataitech.eu/?check=$GITHUB_SHA" | cmp -s - website/dist/index.html; then
              echo "dataitech.eu is live with this build"; exit 0
            fi
            sleep 10
          done
          echo "::warning::Upload finished, but dataitech.eu does not show the new page yet. If it stays that way, purge the cache in hPanel (Websites > dataitech.eu > Performance > CDN)."
